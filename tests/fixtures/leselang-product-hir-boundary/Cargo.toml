[package]
name = "leselang-product-hir-boundary"
version = "0.0.0"
edition = "2024"
publish = false

# Deliberately outside the root workspace: use the published native facades,
# not local compatibility features that could hide a product dependency.
[workspace]

[lib]
test = false
doctest = false

[dependencies]
leselang-hir = { git = "https://github.com/Team-silvortex/leselang", rev = "5f86dfb8dd79a28986fe5eb4cbfe6b044796f935", version = "=0.1.0" }
leselang-vm = { git = "https://github.com/Team-silvortex/leselang", rev = "5f86dfb8dd79a28986fe5eb4cbfe6b044796f935", version = "=0.1.0" }
leserpent-hir = { path = "../../../crates/leserpent-hir" }
leselang-host-contract = { path = "../../../crates/leselang-host-contract" }
leselang-runtime-core = { git = "https://github.com/Team-silvortex/leselang", rev = "5f86dfb8dd79a28986fe5eb4cbfe6b044796f935", version = "=0.1.0" }
leselang-syntax = { git = "https://github.com/Team-silvortex/leselang", rev = "5f86dfb8dd79a28986fe5eb4cbfe6b044796f935", version = "=0.1.0" }

[dev-dependencies]
serde_json = "1"

[profile.lean]
inherits = "dev"
debug = 0
incremental = false
