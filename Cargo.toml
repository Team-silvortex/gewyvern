[workspace]
members = [
    ".",
    "crates/gewyc",
    "crates/leselang-command",
    "crates/leselang-hir",
    "crates/leselang-syntax",
    "crates/leselang-vm",
    "crates/leserpent-domain",
    "crates/leserpent-protocol",
    "crates/leserpent-runtime",
    "apps/etragon",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.39.0", features = ["bundled", "limits"] }

[package]
name = "gewyvern"
version = "1.0.0"
edition = "2024"
description = "Linux-first protocol debugging and evidence reconstruction runtime"
license.workspace = true
default-run = "gewyvern"

[dependencies]
serde.workspace = true
serde_json.workspace = true
x509-parser = "0.18.1"
