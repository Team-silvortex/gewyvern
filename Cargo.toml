[workspace]
members = [
    ".",
    "crates/gewyc",
    "crates/leselang-command",
    "crates/leselang-hir",
    "crates/leselang-observe",
    "crates/leselang-syntax",
    "crates/leselang-ui",
    "crates/leselang-vm",
    "crates/leserpent-domain",
    "crates/leserpent-adapters",
    "crates/leserpent-cli",
    "crates/leserpent-protocol",
    "crates/leserpent-runtime",
    "crates/leserpentd",
    "apps/etragon",
]
resolver = "3"

[workspace.package]
version = "1.14.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
rusqlite = { version = "=0.39.0", features = ["bundled", "limits"] }
signal-hook = "0.3"
time = { version = "0.3", features = ["parsing"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[package]
name = "gewyvern"
version = "1.14.0"
edition = "2024"
description = "Linux-first protocol debugging and evidence reconstruction runtime"
license.workspace = true
default-run = "gewyvern"

[dependencies]
serde.workspace = true
serde_json.workspace = true
http.workspace = true
ring = "0.17"
rustls.workspace = true
x509-parser = "0.18.1"
leserpent-protocol = { path = "crates/leserpent-protocol" }
rcgen = "0.14"
zeroize = "1"

[dev-dependencies]
leselang-hir = { path = "crates/leselang-hir" }
leselang-syntax = { path = "crates/leselang-syntax" }
leselang-vm = { path = "crates/leselang-vm" }
leserpent-domain = { path = "crates/leserpent-domain" }
