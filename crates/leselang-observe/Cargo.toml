[package]
name = "leselang-observe"
version.workspace = true
edition.workspace = true
description = "Sanitized Leserpent UI projections with an optional reference-VM mutation bridge"
license.workspace = true

[features]
# Retain released behavior; read-only consumers opt out explicitly.
default = ["sqlite-journal"]
vm-bridge = ["dep:leserpent-vm"]
sqlite-journal = ["vm-bridge", "leserpent-vm/sqlite-journal"]

[dependencies]
leselang-command = { path = "../leselang-command" }
leserpent-hir = { path = "../leserpent-hir" }
leselang-host-contract = { path = "../leselang-host-contract" }
leselang-runtime-core.workspace = true
leselang-ui = { path = "../leselang-ui" }
leserpent-vm = { path = "../leserpent-vm", optional = true, default-features = false }
leserpent-domain = { path = "../leserpent-domain" }
serde.workspace = true

[dev-dependencies]
leselang-syntax.workspace = true
serde_json.workspace = true
