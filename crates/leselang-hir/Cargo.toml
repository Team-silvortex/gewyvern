[package]
name = "leselang-hir"
version.workspace = true
edition.workspace = true
description = "Typed, capability-aware high-level IR for Leselang"
license.workspace = true

[features]
default = ["leserpent-profile"]
leserpent-profile = ["dep:leserpent-hir", "dep:leselang-host-contract"]

[dependencies]
leselang-hir-core = { path = "../leselang-hir-core" }
leserpent-hir = { path = "../leserpent-hir", optional = true }
leselang-host-contract = { path = "../leselang-host-contract", optional = true }
leselang-runtime-core = { path = "../leselang-runtime-core" }
leselang-syntax = { path = "../leselang-syntax" }
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
