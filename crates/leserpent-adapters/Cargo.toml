[package]
name = "leserpent-adapters"
version.workspace = true
edition.workspace = true
description = "Capability-bounded external effect adapters for Leserpent"
license.workspace = true

[features]
default = []
native-ssh = ["dep:russh", "dep:russh-sftp", "dep:tokio"]

[dependencies]
leserpent-domain = { path = "../leserpent-domain" }
leserpent-protocol = { path = "../leserpent-protocol" }
leserpent-runtime = { path = "../leserpent-runtime" }
serde.workspace = true
serde_json.workspace = true
rustls.workspace = true
ring = "0.17"
russh = { version = "0.62.3", default-features = false, features = ["ring"], optional = true }
russh-sftp = { version = "2.3.0", optional = true }
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "time"], optional = true }
zeroize = "1"

[dev-dependencies]
rcgen = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
