[package]
name = "leserpent-vm"
version.workspace = true
edition.workspace = true
description = "Leserpent execution adapter and durable journal for Leselang"
license.workspace = true

[features]
default = ["sqlite-journal"]
sqlite-journal = ["dep:rusqlite"]

[dependencies]
leselang-command = { path = "../leselang-command" }
leselang-hir = { path = "../leselang-hir", default-features = false, features = ["leserpent-profile"] }
leselang-host-contract = { path = "../leselang-host-contract" }
leselang-runtime-core = { path = "../leselang-runtime-core" }
leselang-syntax = { path = "../leselang-syntax" }
leserpent-domain = { path = "../leserpent-domain" }
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
