[package]
name = "leserpent-vm"
version.workspace = true
edition.workspace = true
description = "Leserpent execution adapter and durable journal for Leselang"
license.workspace = true

[features]
default = ["sqlite-journal"]
sqlite-journal = ["dep:rusqlite"]

[dependencies]
leselang-hir-core = { path = "../leselang-hir-core" }
leselang-command = { path = "../leselang-command" }
leserpent-hir = { path = "../leserpent-hir" }
leselang-host-contract = { path = "../leselang-host-contract" }
leselang-runtime-core = { path = "../leselang-runtime-core" }
leselang-syntax = { path = "../leselang-syntax" }
leserpent-domain = { path = "../leserpent-domain" }
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[[test]]
name = "debugger_audit_durable"
required-features = ["sqlite-journal"]

[[test]]
name = "backpressure"
required-features = ["sqlite-journal"]

[[test]]
name = "clock_boundaries"
required-features = ["sqlite-journal"]

[[test]]
name = "retry_backoff"
required-features = ["sqlite-journal"]

[[test]]
name = "dispatch_scheduling"
required-features = ["sqlite-journal"]

[[test]]
name = "admission"
required-features = ["sqlite-journal"]

[[test]]
name = "concurrency"
required-features = ["sqlite-journal"]

[[test]]
name = "restore_allocator"
required-features = ["sqlite-journal"]

[[test]]
name = "prepared_groups"
required-features = ["sqlite-journal"]

[[test]]
name = "prepared_bindings"
required-features = ["sqlite-journal"]

[[test]]
name = "group_receipts"
required-features = ["sqlite-journal"]

[[test]]
name = "group_binding"
required-features = ["sqlite-journal"]

[[test]]
name = "group_capture"
required-features = ["sqlite-journal"]

[[test]]
name = "group_dataflow"
required-features = ["sqlite-journal"]

[[test]]
name = "group_conditional"
required-features = ["sqlite-journal"]

[[test]]
name = "result_binding"
required-features = ["sqlite-journal"]

[[test]]
name = "successor"
required-features = ["sqlite-journal"]

[[test]]
name = "dataflow"
required-features = ["sqlite-journal"]

[[test]]
