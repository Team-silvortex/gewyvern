[package]
name = "leselang-vm"
version.workspace = true
edition.workspace = true
description = "Stackless Leselang evaluator with versioned effect continuations"
license.workspace = true

[features]
default = ["sqlite-journal"]
sqlite-journal = ["dep:rusqlite"]

[dependencies]
leselang-command = { path = "../leselang-command" }
leselang-hir = { path = "../leselang-hir" }
leselang-host-contract = { path = "../leselang-host-contract" }
leselang-runtime-core = { path = "../leselang-runtime-core" }
leserpent-domain = { path = "../leserpent-domain" }
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
leselang-syntax = { path = "../leselang-syntax" }

# These suites exercise durable recovery or compare both backends.
# Memory-only integration suites remain available without default features.
[[test]]
name = "admission"
required-features = ["sqlite-journal"]

