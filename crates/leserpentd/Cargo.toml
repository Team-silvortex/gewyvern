[package]
name = "leserpentd"
version.workspace = true
edition.workspace = true
description = "Standalone Leserpent runtime host and bounded effect worker"
license.workspace = true

[features]
default = []
native-ssh = ["leserpent-adapters/native-ssh"]

[dependencies]
leselang-ui = { path = "../leselang-ui" }
leserpent-adapters = { path = "../leserpent-adapters" }
leserpent-domain = { path = "../leserpent-domain" }
leserpent-protocol = { path = "../leserpent-protocol" }
leserpent-runtime = { path = "../leserpent-runtime" }
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
time.workspace = true
rustls.workspace = true
ring = "0.17"
rcgen = "0.14"
tungstenite.workspace = true
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
leselang-hir = { path = "../leselang-hir" }
leselang-syntax = { path = "../leselang-syntax" }
rcgen = "0.14"
rusqlite.workspace = true
