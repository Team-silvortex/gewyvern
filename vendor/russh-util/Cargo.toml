[package]
name = "russh-util"
version = "0.52.0"
edition = "2021"
rust-version = "1.75"
description = "Runtime abstraction utilities for russh."
license = "Apache-2.0"
repository = "https://github.com/warp-tech/russh"
publish = false

[dependencies]
tokio = { version = "1.17.0", features = ["sync", "macros"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.17.0", features = ["io-util", "rt-multi-thread", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.43"
