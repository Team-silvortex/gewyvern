name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  leselang-core:
    name: Standalone Leselang runtime foundation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy

      - name: Package and verify isolated runtime core
        run: cargo +1.98.0 package -p leselang-runtime-core --locked

      # Package verification builds the library, not its dev-dependencies.
      - name: Fetch normalized standalone test dependencies
        run: cargo +1.98.0 fetch --manifest-path target/package/leselang-runtime-core-*/Cargo.toml --locked

      - name: Test normalized standalone package
        run: cargo +1.98.0 test --manifest-path target/package/leselang-runtime-core-*/Cargo.toml --locked --offline

      - name: Test host-defined HIR without the Leserpent profile
        run: cargo +1.98.0 test -p leselang-hir --locked --no-default-features

      - name: Lint native-only HIR and its tests
        run: cargo +1.98.0 clippy -p leselang-hir --locked --no-default-features --all-targets -- -D warnings

      - name: Verify native source and separate consumer outside the monorepo
        run: >-
          cargo +1.98.0 run --locked -p gewyvern-dev --
          package leselang --output "$RUNNER_TEMP/leselang-native-source" --verify

      - name: Test reference protocol and capture execution without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --test captured_execution --test capture_scope --test structured_value --test result_domain --test host_protocol --test result_binding --test merge_plan --test continuation_admission --test reference_continuation --test reference_value --test reference_merge --test reference_completion --test reference_dispatch --test reference_recovery --test reference_dispatch_recovery --test reference_group_recovery --test reference_merge_output --test reference_group_batch --test reference_group_reservations --test reference_bound_receipt --test reference_bound_records --test reference_group_binding --test reference_checkpoint --test reference_group_successor --test reference_group_execution

      - name: Test product computation policy without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --lib --test reference_computation

      - name: Test product request construction and live dispatch authority
        run: cargo +1.98.0 test -p leselang-command -p leselang-vm --locked request_construction --no-fail-fast

      - name: Test group-start assembly without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --test reference_group_start

      - name: Test group-start parity and transactional restart boundaries
        run: cargo +1.98.0 test -p leselang-vm --locked --lib group_start

      - name: Test root-start coordination without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --test reference_start

      - name: Test root-start parity and atomic admission boundaries
        run: cargo +1.98.0 test -p leselang-vm --locked --lib start_contract_tests::root_start

      - name: Test continuation import policy without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --test reference_restore

      - name: Test import parity and durable rollback boundaries
        run: |
          cargo +1.98.0 test -p leselang-vm --locked --lib restore_contract_tests::

      - name: Test reference VM with the SQLite backend disabled
        run: cargo +1.98.0 test -p leselang-vm --locked --no-default-features --features leserpent-profile

      - name: Test reply entry policy without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --test reference_reply

      - name: Test reply parity and durable completion boundaries
        run: cargo +1.98.0 test -p leselang-vm --locked --lib reply_contract_tests::reply_entries

      - name: Test result completion policy without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --test reference_result_completion

      - name: Test result completion parity and native settlement boundaries
        run: cargo +1.98.0 test -p leselang-vm --locked --lib completion_contract_tests::result_completion

      - name: Test successor assembly without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --test reference_successor

      - name: Test successor assembly parity and native transaction boundaries
        run: cargo +1.98.0 test -p leselang-vm --locked --lib assembly_contract_tests::successor_assembly

      - name: Test cancellation entry policy without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --test reference_cancellation

      - name: Test cancellation parity and native audit boundaries
        run: cargo +1.98.0 test -p leselang-vm --locked --lib cancellation_contract_tests::cancellation_entries

      - name: Test retry entry policy without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --test reference_retry

      - name: Test retry parity and native lease transaction boundaries
        run: cargo +1.98.0 test -p leselang-vm --locked --lib retry_contract_tests::retry_entry

      - name: Test claim entry policy without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --test reference_claim

      - name: Test claim parity and native cache publication boundaries
        run: cargo +1.98.0 test -p leselang-vm --locked --lib claim_contract_tests::claim_entries

      - name: Test result conversion without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --test reference_result

      - name: Test frozen result conversion and native settlement parity
        run: |
          cargo +1.98.0 test -p leselang-vm --locked --lib result_conversion_contract_tests::conversion_matches
          cargo +1.98.0 test -p leselang-vm --locked --lib completion_contract_tests::result_completion

      - name: Test settlement routing without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --test reference_settlement

      - name: Test cancellation and retry settlement without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --test reference_interruption_settlement

      - name: Test group visibility and cache policy without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --test reference_visibility

      - name: Test frozen group visibility and cache reconciliation parity
        run: cargo +1.98.0 test -p leselang-vm --locked --lib visibility_contract_tests

      - name: Test retention and expiry coordination without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --test reference_maintenance

      - name: Test frozen retention and expiry cache publication parity
        run: cargo +1.98.0 test -p leselang-vm --locked --lib maintenance_contract_tests

      - name: Test sequence selection without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --test reference_allocation

      - name: Test frozen sequence selection and shared journal reservations
        run: cargo +1.98.0 test -p leselang-vm --locked --lib allocation_contract_tests

      - name: Test startup coordination without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --test reference_startup

      - name: Test frozen startup and native recovery lifecycle parity
        run: cargo +1.98.0 test -p leselang-vm --locked --lib startup_contract_tests

      - name: Test root publication without linking the VM
        run: cargo +1.98.0 test -p leselang-command --locked --test reference_publication

      - name: Test native publication failures and shared-owner admission races
        run: cargo +1.98.0 test -p leselang-vm --locked --lib publication_contract_tests

      - name: Test import publication and committed lease adoption across restart
        run: cargo +1.98.0 test -p leselang-vm --locked --lib adoption_contract_tests

      - name: Test adapter-owned root admission lifecycle
        run: cargo +1.98.0 test -p leselang-command --locked --test reference_admission

      - name: Test root admission compatibility and native storage boundaries
        run: |
          cargo +1.98.0 test -p leselang-vm --locked --lib admission_contract_tests
          cargo +1.98.0 test -p leselang-vm --locked --test admission

      - name: Test reference journal schema ownership and legacy migration parity
        run: |
          cargo +1.98.0 test -p leselang-command --locked --test reference_journal_schema
          cargo +1.98.0 test -p leselang-vm --locked --lib schema_contract_tests
          cargo +1.98.0 test -p leselang-vm --locked --lib journal_v

      - name: Test audit recovery policy and atomic checkpoint publication
        run: |
          cargo +1.98.0 test -p leselang-command --locked --test reference_audit_recovery
          cargo +1.98.0 test -p leselang-vm --locked --lib audit_recovery_contract_tests
          cargo +1.98.0 test -p leselang-vm --locked --test debugger_audit_durable --test debugger_audit_memory

      - name: Test audited cancellation policy and native commit parity
        run: |
          cargo +1.98.0 test -p leselang-command --locked --test reference_audit_commit
          cargo +1.98.0 test -p leselang-vm --locked --lib audit_commit_contract_tests

      - name: Test audit record projections and native lookup diagnostics
        run: |
          cargo +1.98.0 test -p leselang-command --locked --test reference_audit_read
          cargo +1.98.0 test -p leselang-vm --locked --lib audit_read_contract_tests

      - name: Test ordinary cancellation policy and native commit parity
        run: |
          cargo +1.98.0 test -p leselang-command --locked --test reference_cancellation_commit
          cargo +1.98.0 test -p leselang-vm --locked --lib cancellation_commit_contract_tests

      - name: Test retry journal policy and native commit parity
        run: |
          cargo +1.98.0 test -p leselang-command --locked --test reference_retry_commit
          cargo +1.98.0 test -p leselang-vm --locked --lib retry_commit_contract_tests

      - name: Test dispatch acknowledgement policy and native commit parity
        run: |
          cargo +1.98.0 test -p leselang-command --locked --test reference_acknowledgement_commit
          cargo +1.98.0 test -p leselang-vm --locked --lib acknowledgement_commit_contract_tests

      - name: Test ordinary completion policy and native commit parity
        run: |
          cargo +1.98.0 test -p leselang-command --locked --test reference_completion_commit
          cargo +1.98.0 test -p leselang-vm --locked --lib completion_commit_contract_tests

      - name: Test native settlement peer-winner publication
        run: cargo +1.98.0 test -p leselang-vm --locked --lib settlement_contract_tests::settlement_sqlite

      - name: Test read-only projections without the VM or SQLite
        run: cargo +1.98.0 test -p leselang-observe --locked --no-default-features

      - name: Lint read-only projections and their consumers
        run: cargo +1.98.0 clippy -p leselang-observe --locked --no-default-features --all-targets -- -D warnings

      - name: Test debugger mutation bridge without SQLite
        run: cargo +1.98.0 test -p leselang-observe --locked --no-default-features --features vm-bridge

      - name: Lint debugger mutation bridge without SQLite
        run: cargo +1.98.0 clippy -p leselang-observe --locked --no-default-features --features vm-bridge --all-targets -- -D warnings

      - name: Lint database-free reference VM and its tests
        run: cargo +1.98.0 clippy -p leselang-vm --locked --no-default-features --features leserpent-profile --all-targets -- -D warnings

      - name: Test native VM facade without product or storage features
        run: cargo +1.98.0 test -p leselang-vm --locked --no-default-features

      - name: Lint native VM facade and its host adapters
        run: cargo +1.98.0 clippy -p leselang-vm --locked --no-default-features --all-targets -- -D warnings

  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Select Rust toolchain
        run: rustup default 1.98.0

      - name: Install RustSec audit tool
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust dependencies
        run: cargo audit --no-yanked -D warnings

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          rustfmt +1.98.0 --edition 2024 --check crates/leselang-hir/src/leserpent_profile.rs
          rustfmt +1.98.0 --edition 2024 --check crates/leselang-vm/src/leserpent_profile.rs

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --all-targets --all-features --locked

      - name: Test workspace
        run: cargo test --workspace --all-features --locked

  product-surfaces:
    name: TypeScript and .NET quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Select Rust toolchain
        run: rustup default 1.98.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/leserpent/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Install frontend dependencies
        run: npm ci --prefix apps/leserpent

      - name: Audit frontend dependencies
        run: |
          npm audit --prefix apps/leserpent --json
          npm audit --prefix apps/leserpent --omit=dev --json

      - name: Validate language packs
        run: npm run verify:language-packs --prefix apps/leserpent

      - name: Type-check frontend
        run: npm run check:frontend --prefix apps/leserpent

      - name: Verify packaged frontend
        run: npm run verify:frontend-package --prefix apps/leserpent

      - name: Restore Leserpent service
        run: dotnet restore apps/leserpent/leserpent.slnx --locked-mode -p:ContinuousIntegrationBuild=true

      - name: Test Leserpent service
        run: dotnet test apps/leserpent/leserpent.slnx --no-restore --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Restore Leserpent desktop
        run: dotnet restore apps/leserpent-avalonia/src/Leserpent.Avalonia/Leserpent.Avalonia.csproj --locked-mode -p:ContinuousIntegrationBuild=true

      - name: Build Leserpent desktop
        run: dotnet build apps/leserpent-avalonia/src/Leserpent.Avalonia/Leserpent.Avalonia.csproj --no-restore --configuration Release -p:ContinuousIntegrationBuild=true

  release-packaging:
    name: Current artifact release packaging gate
    needs: [rust, product-surfaces, leselang-core]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEWY_DOCKER_EXECUTION: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Select Rust toolchain
        run: rustup default 1.98.0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Check Docker and evidence prerequisites
        run: |
          docker info
          command -v jq
          command -v curl
          mkdir -p target/validation
          git rev-parse HEAD > target/validation/ci-source-commit.txt
          rustc --version > target/validation/ci-toolchain.txt
          dotnet --version >> target/validation/ci-toolchain.txt
          docker version >> target/validation/ci-toolchain.txt

      - name: Validate version and status metadata
        run: |
          cargo dev version check
          cargo run --quiet --locked --bin gewyvern_status -- validate
          cargo test --locked --test project_status_tdd

      - name: Rebuild and validate current deb and rpm artifacts
        run: >-
          cargo run --quiet --locked --bin gewyvern_validate --
          --json --json-out target/validation/ci-release-gate.json release-gate

      - name: Require all default stages and a consistent publication
        run: |
          set -euo pipefail
          jq -e '
            .schema_version == 1 and .command == "release-gate" and .ok == true and
            .extra.stages.build_packages == true and
            .extra.stages.release_container_check == true and
            .extra.stages.three_module_stack_smoke == true and
            .extra.stages.debugger_cross_validation == true and
            .extra.stages.pathological_container_validation == true and
            .extra.remote == null and
            .extra.gate_posture == "local_only" and .extra.ship_signal == "remote_missing"
          ' target/validation/ci-release-gate.json
          publication_id=$(jq -er '
            select(.schema_version == 2) | .publication_id |
            select(type == "string" and test("^[0-9]+-[0-9]+-[0-9]+$"))
          ' target/validation/release-gate-artifacts.json)
          test "$(sed -n 's/^publication_id=//p' target/validation/release-gate-artifacts.txt)" = "$publication_id"
          # A local packaged gate is evidence, not a physical-host or Apple ship signal.

      - name: Preserve current artifacts and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-packaging-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/packages/**/*.deb
            target/packages/**/*.rpm
            target/packages/build-manifest.txt
            target/packages/build-timings.txt
            target/validation/
          if-no-files-found: error
          retention-days: 14
